[project]
name = "projeto-final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafael Garcia", email = "rafa.informatica@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "faster-whisper>=1.2.1",
    "llama-cpp-python>=0.3.35",
    "loguru>=0.7.3",
    "openai>=3.6.0",
    "piper-tts>=1.7.0",
    "pymupdf>=1.24",
    "pypdf>=6.16.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
projeto-final = "projeto_final:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
